name: Daily Content Engine
on:
  schedule:
    - cron: '0 13 * * *'
    - cron: '0 14 * * 1,4'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode (use market_data to test commit 1)'
        type: choice
        options:
          - daily
          - seo
          - market_data
        default: daily

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install anthropic feedparser requests
      - name: Run daily pipeline
        if: github.event.schedule == '0 13 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'daily')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUBLICATION_ID: ${{ secrets.BEEHIIV_PUBLICATION_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python starter_automation.py --mode daily
      - name: Run SEO generation
        if: github.event.schedule == '0 14 * * 1,4' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'seo')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python starter_automation.py --mode seo
      - name: Test market data fetchers
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'market_data'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python starter_automation.py --mode market_data
      - name: Commit generated content
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "auto: pipeline run"
          git push
